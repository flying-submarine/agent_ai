# 第 8 课第 5 步：docker-compose.yml——一条命令同时起 Qdrant 和 rag-app。
# 用法（在 ~/Desktop/day1 里，两个 key 已 export；先删掉之前手动起的同名容器）：
#   docker rm -f rag-app qdrant
#   docker compose up -d --build
#   docker compose ps
#   curl http://localhost:8000/stats
#   curl http://localhost:6333/
# 停掉：docker compose down（卷还在，数据不丢；想连卷一起删才加 -v）
services:
  qdrant:
    image: qdrant/qdrant
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  rag-app:
    build: .
    container_name: rag-app
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - SILICONFLOW_API_KEY=${SILICONFLOW_API_KEY}
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  # external: true = 复用之前手动建的 qdrant_storage 卷（里面已经有 4 块文档）。
  # 不写这行，compose 会新建一个 day1_qdrant_storage 空卷，老数据就读不到了。
  qdrant_storage:
    external: true
